x-postgres: &postgres
  POSTGRES_DB: assignment
  POSTGRES_USER: test

x-django-env: &django-env
  <<: *postgres
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_SSLMODE: prefer
  REDIS_URL: redis://redis:6379/0

x-django: &django
  build: .
  env_file:
    - path: .env
      required: false
  environment: *django-env
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      <<: *postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crewlink-local-dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed"
    env_file:
    - path: .env
      required: false
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api1:
    <<: *django
    healthcheck: &api-health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 3)"]
      interval: 5s
      timeout: 3s
      retries: 12

  api2:
    <<: *django
    healthcheck: *api-health

  worker:
    <<: *django
    command: python manage.py run_worker

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
